<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <!-- Dark moody red gradient background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a0404" />
      <stop offset="50%" stop-color="#260101" />
      <stop offset="100%" stop-color="#0a0000" />
    </linearGradient>
    
    <!-- Shadow for depth -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)" />

  <!-- Industrial dark border frame -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#111" stroke-width="12" filter="url(#dropShadow)" />
  <rect x="44" y="44" width="1112" height="542" fill="none" stroke="#3a0404" stroke-width="2" />

  <!-- Floating Elements: Distant Guitar Picks -->
  <path d="M 120,140 C 160,130 180,160 150,210 C 140,220 100,160 120,140 Z" fill="#111" opacity="0.4" />
  <path d="M 1050,480 C 1090,470 1110,500 1080,550 C 1070,560 1030,500 1050,480 Z" fill="#111" opacity="0.3" transform="rotate(45 1070 510)" />
  <path d="M 850,80 C 880,70 900,90 880,130 C 870,140 840,90 850,80 Z" fill="#111" opacity="0.2" transform="rotate(-20 860 100)" />

  <!-- Abstract Lightning Bolt (Right Side) -->
  <path d="M 950,220 L 890,350 L 930,350 L 870,500 L 970,310 L 920,310 Z" fill="none" stroke="#800a0a" stroke-width="6" opacity="0.6" filter="url(#dropShadow)"/>

  <!-- Left Side Logo Icon: Dark Guitar Pick + Music Note -->
  <g transform="translate(240, 210)" filter="url(#dropShadow)">
    <!-- Pick shape -->
    <path d="M 60,0 C 140,0 180,70 100,200 C 90,215 20,70 60,0 Z" fill="#151515" stroke="#333" stroke-width="4"/>
    <!-- Music Note inside pick -->
    <circle cx="85" cy="140" r="22" fill="#f4f4f4" />
    <rect x="99" y="60" width="8" height="80" fill="#f4f4f4" />
    <path d="M 100,60 Q 140,65 145,100" fill="none" stroke="#f4f4f4" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Main Title -->
  <text x="430" y="325" font-family="'Impact', 'Arial Black', sans-serif" font-size="120" font-weight="900" fill="#fcfcfc" letter-spacing="5" filter="url(#dropShadow)">MUSIX</text>
  
  <!-- Subtitle Text -->
  <text x="435" y="385" font-family="'Arial', sans-serif" font-size="22" font-weight="bold" fill="#d9d9d9" letter-spacing="2" filter="url(#dropShadow)">THE HUB FOR MUSIC ENTHUSIASTS.</text>
  <text x="435" y="425" font-family="'Arial', sans-serif" font-size="22" font-weight="bold" fill="#d9d9d9" letter-spacing="2" filter="url(#dropShadow)">SHARE. DISCOVER. CONNECT.</text>

</svg>
